# ==============================================================================
# Nginx Configuration for Ristorante Raviolo d'Oro su VPS Hostinger (69.62.111.38)
# Percorso su VPS: /etc/nginx/sites-available/raviolodoro
# Abilitazione: ln -sf /etc/nginx/sites-available/raviolodoro /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    listen 8090; # Porta di test dedicata per Raviolo d'Oro (8080 è occupata da Dify)!

    server_name raviolodoro.com www.raviolodoro.com raviolodoro.it www.raviolodoro.it;

    root /var/www/raviolodoro;
    index index.html;

    # Compressione Gzip per caricamento istantaneo
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache risorse statiche (immagini, icone, font)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Cache CSS e JS
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Intestazioni di sicurezza
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
